---
layout: default
title: Cari
description: Cari berita dan halaman di website Darul Marhamah Al-Qur'an Boarding School.
---
{% include hero.html judul="Cari" sub="Cari berita dan informasi di website ini" %}
<section><div class="wadah" style="max-width:820px">
  <form class="kotak-cari" id="formCari" onsubmit="return false"><input id="q" type="search" placeholder="Ketik kata kunci, misal: tahfidz, PPDB, juara..." autofocus><button class="btn btn-hijau" type="submit">Cari</button></form>
  <div id="hasil" class="hasil-cari"></div>
</div></section>
<script>
(function(){
  var data=null, q=document.getElementById('q'), out=document.getElementById('hasil');
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function cari(){
    var k=q.value.trim().toLowerCase(); if(!data)return;
    if(!k){out.innerHTML='';return}
    var r=data.filter(function(d){return (d.judul+' '+d.isi).toLowerCase().indexOf(k)>-1});
    out.innerHTML=r.length?r.map(function(d){return '<a class="hasil" href="'+d.url+'"><small>'+esc(d.jenis)+(d.tanggal?' · '+esc(d.tanggal):'')+'</small><h3>'+esc(d.judul)+'</h3><p>'+esc(d.isi.slice(0,160))+'…</p></a>'}).join(''):'<p style="color:var(--abu)">Tidak ditemukan hasil untuk "'+esc(k)+'".</p>';
  }
  fetch('{{ "/search.json" | relative_url }}').then(function(r){return r.json()}).then(function(j){data=j;var p=new URLSearchParams(location.search).get('q');if(p){q.value=p}cari()});
  q.addEventListener('input',cari);
})();
</script>
