# Menyalin isi yang diubah di Panel Admin (/admin) ke website.
# Pukul 05.00–23.00 WITA workflow ini terus memantau (perubahan terbit ±2–3 menit setelah Simpan).
# Di luar jam itu berjalan tiap jam. Manual: tab Actions → "Sinkron panel admin" → Run workflow.
name: Sinkron panel admin

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: sinkron
  cancel-in-progress: false

jobs:
  sinkron:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Pantau & terbitkan isi dari panel admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pantau.sh

      # GitHub menonaktifkan jadwal otomatis jika repo sepi 60 hari; ini mencegahnya (sekali sehari).
      - name: Jaga jadwal tetap aktif
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sinkron.yml/enable" || true
          fi
