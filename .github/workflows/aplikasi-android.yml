# Membuat aplikasi Android (APK) secara otomatis dan gratis.
# Hasilnya diterbitkan di halaman Releases, dan selalu bisa diunduh dari:
# https://github.com/abdullahali-afk/SMP-SMA-IT-Darul-Marhamah-ABS/releases/latest/download/DarulMarhamah.apk
# Aplikasi ini membuka sistem online sekolah (halaman /aplikasi/), jadi perubahan website
# langsung terlihat di aplikasi tanpa perlu membuat APK baru.
# Membuat ulang manual: tab Actions → "Aplikasi Android" → Run workflow.
name: Aplikasi Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/aplikasi-android.yml"

permissions:
  contents: write

concurrency:
  group: aplikasi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Siapkan proyek Android
        run: |
          npm ci --no-audit --no-fund
          npx cap add android
          npx @capacitor/assets generate --android --assetPath aset \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#076d45' --splashBackgroundColorDark '#076d45'
          VERSI="1.0.${{ github.run_number }}"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSI\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          echo "VERSI=$VERSI" >> "$GITHUB_ENV"

      - name: Bangun APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Kunci tanda tangan TIDAK disimpan di repo (repo ini publik).
      # Opsional: simpan kunci tetap di Settings → Secrets → Actions sebagai ANDROID_KEYSTORE_BASE64
      # dan ANDROID_KEYSTORE_PASSWORD agar versi APK berikutnya bisa dipasang menimpa versi lama.
      # Tanpa secret itu, setiap build memakai kunci baru (APK baru perlu: hapus aplikasi lama, lalu pasang).
      - name: Tanda tangani APK
        env:
          KUNCI_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KUNCI_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KUNCI_BASE64" ] && [ -n "$KUNCI_PASSWORD" ]; then
            echo "$KUNCI_BASE64" | base64 -d > "$RUNNER_TEMP/kunci.jks"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum diisi, memakai kunci sementara."
            KUNCI_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/kunci.jks" -alias darulmarhamah -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KUNCI_PASSWORD" -keypass "$KUNCI_PASSWORD" \
              -dname "CN=Darul Marhamah ABS, O=SMP SMA IT Darul Marhamah, L=Makassar, C=ID"
          fi
          export KUNCI_PASSWORD
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/selaras.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/kunci.jks" --ks-pass env:KUNCI_PASSWORD --key-pass env:KUNCI_PASSWORD \
            --out DarulMarhamah.apk "$RUNNER_TEMP/selaras.apk"
          "$BT/apksigner" verify DarulMarhamah.apk
          rm -f "$RUNNER_TEMP/kunci.jks" "$RUNNER_TEMP/selaras.apk"
          ls -la DarulMarhamah.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DarulMarhamah-${{ env.VERSI }}
          path: android-app/DarulMarhamah.apk

      - name: Terbitkan di Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v$VERSI"
          gh release create "$TAG" DarulMarhamah.apk --target "$GITHUB_SHA" --latest \
            --title "Aplikasi Android Darul Marhamah $VERSI" \
            --notes "Unduh **DarulMarhamah.apk** di bawah ini, buka file-nya di HP Android, lalu pilih Pasang/Install. Jika muncul peringatan 'sumber tidak dikenal', izinkan pemasangan dari browser/File Manager Anda."
